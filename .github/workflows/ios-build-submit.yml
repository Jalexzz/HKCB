name: Build & Submit iOS App

on:
  push:
    branches: #test
      - deploy # <--- Exclusively monitors the deploy branch
    paths-ignore:
      - "**.md"

jobs:
  build-and-submit-ios:
    runs-on: macos-latest

    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: "npm"

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Build Locally and Submit to App Store Connect
        run: eas build --platform ios --profile production --local --non-interactive --auto-submit
