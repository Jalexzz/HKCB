name: Build & Submit (iOS Only)

# 👇 Exclusively uses workflow_dispatch. It will never run automatically.
on:
  workflow_dispatch:

jobs:
  build-and-submit-ios:
    # CRITICAL: Must remain macos-latest because we are compiling native iOS code locally
    runs-on: macos-latest

    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: "npm"

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm install
      
      - name: 🔍 Debug Targets Directory
        run: ls -la targets
        
      - name: 🚀 Build Locally (iOS)
        run: eas build --platform ios --profile production --local --non-interactive --output ./app.ipa

      - name: 📤 Submit to App Store Connect
        run: eas submit --platform ios --profile production --path ./app.ipa --non-interactive --no-wait
