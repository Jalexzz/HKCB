name: EAS Prebuild (iOS Only)

# 👇 The push block is completely removed. It will NEVER run automatically now.
on:
  workflow_dispatch:

jobs:
  prebuild:
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: "npm"

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Clear iOS cache artifacts
        run: |
          rm -rf ios
          rm -rf .expo
          rm -rf node_modules
    
      - name: 📦 Install dependencies
        run: npm install

      - name: Remove existing native directories
        run: rm -rf ios android

      - name: Debug Target Configs
        run: |
          find targets -type f
          echo "--- First target config ---"
          cat targets/FirstCallDirectory/expo-target.config.js
          echo "--- Second target config ---"
          cat targets/SecondCallDirectory/expo-target.config.js

      - name: 🚀 Prebuild (iOS Only)
        # Because there is no push trigger, it will strictly use your manual input message
        run: npx expo prebuild --platform ios --clean
